databases:
  - name: order-cancel-db
    region: singapore
    plan: basic-256mb
    databaseName: order_cancel
    user: order_cancel

services:
  - type: web
    name: order-cancel
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run setup && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: order-cancel-db
          property: connectionString
      - key: SHOPIFY_API_KEY
        value: 4ca1358717a01e23a4ea1c77b95d519f
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_orders,write_orders,write_products,write_metaobjects,write_metaobject_definitions,read_customers,read_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,read_assigned_fulfillment_orders
      - key: READY_TO_SHIP_TAGS
        value: ready-to-ship,rts